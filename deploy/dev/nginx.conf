# Docker's internal service discovery follows app container recreation. This
# resolver is only for this reverse proxy, not the application's outbound DNS.
resolver 127.0.0.11 valid=5s;
upstream central {
    zone central 64k;
    server app:8080 resolve;
}

server {
    listen 8080;
    server_name localhost;
    root /srv/frontend/current;
    index index.html;
    client_max_body_size 8m;
    if (!-f /srv/frontend/.ready) {
        return 503;
    }

    # Keep the original browser Host and Origin for Central's formal boundary.
    location /api/v1 {
        proxy_pass http://central;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
    location = /livez {
        proxy_pass http://central;
        proxy_set_header Host $http_host;
    }
    location = /readyz {
        proxy_pass http://central;
        proxy_set_header Host $http_host;
    }
    location = /diagnostics {
        proxy_pass http://central;
        proxy_set_header Host $http_host;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
