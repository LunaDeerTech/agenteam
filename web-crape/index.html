<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/assets/brand/agenteam-icon-512-light.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/assets/brand/agenteam-icon-512-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <title>agenteam</title>
    <script>
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
