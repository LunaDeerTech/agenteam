核对接口、共享组件、主题与交互规则，保持 Debug 边界；实现正常、异常、异步恢复及可访问性行为。Vue 测试按需读取 vue-testing-best-practices，浏览器任务默认读取 .agents/skills/agenteam-test-engineering/SKILL.md，已有 playwright 技能可补充；报告真实工程与浏览器检查，未执行不称通过。
